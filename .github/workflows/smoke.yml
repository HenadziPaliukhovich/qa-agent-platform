name: QA Agent Health

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  health:
    runs-on: ubuntu-latest

    env:
      BASE_URL: http://127.0.0.1:8001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker Compose
        run: |
          docker --version
          docker compose version

      - name: Build and start API stack
        run: |
          docker compose up -d --build

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -sSf "$BASE_URL/health" >/dev/null 2>&1; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done
          echo "API did not become ready in time"
          docker compose ps
          docker compose logs --tail 200
          exit 1

      - name: Run health checks
        run: |
          curl --fail "$BASE_URL/health"
          curl --fail "$BASE_URL/openapi.json" > openapi.json
          python3 -c 'import json, pathlib; data = json.loads(pathlib.Path("openapi.json").read_text()); print("OpenAPI paths count:", len(data.get("paths", {})))'

      - name: Run requirements analysis regression
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pydantic
          BASE_URL="$BASE_URL" DOMAIN_ID=11111111-1111-1111-1111-111111111111 MODEL_PROVIDER=ollama MODEL_NAME=llama3 python scripts/smoke_requirements_analysis.py

      - name: Upload API logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-agent-health-logs
          path: |
            openapi.json
