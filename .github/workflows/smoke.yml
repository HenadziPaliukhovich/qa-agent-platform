name: QA Agent Smoke

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  smoke:
    runs-on: ubuntu-latest

    env:
      BASE_URL: http://127.0.0.1:8001
      PYTHON_BIN: python3
      FAIL_ON_EMPTY_TEST_CASES: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Docker Compose
        run: |
          docker --version
          docker compose version

      - name: Build and start stack
        run: |
          docker compose up -d --build qa_task_api qa_orchestrator qa_result_service qa_rag_service

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -sSf "$BASE_URL/health" >/dev/null 2>&1; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done
          echo "API did not become ready in time"
          docker compose ps
          docker compose logs --tail 200 qa_task_api qa_orchestrator qa_result_service qa_rag_service
          exit 1

      - name: Diagnose task API routes
        run: |
          curl --fail "$BASE_URL/health"
          curl --fail "$BASE_URL/openapi.json" > openapi.json
          echo "==> OpenAPI paths"
          python3 -c 'import json, pathlib; data = json.loads(pathlib.Path("openapi.json").read_text()); print("\n".join(sorted(data.get("paths", {}).keys())))'
          echo "==> qa_task_api logs"
          docker compose logs --tail 200 qa_task_api

      - name: Seed default domain in Postgres
        run: |
          docker compose exec -T postgres psql -U qa -d qa_agent <<'SQL'
          insert into domains (domain_id, name, slug, description, status, tags)
          values (
            '11111111-1111-1111-1111-111111111111',
            'Payments',
            'payments',
            'Smoke Payments domain',
            'active',
            '["payments","smoke"]'::jsonb
          )
          on conflict (slug) do nothing;
          SQL

      - name: Run smoke suite
        env:
          DOMAIN_ID: 11111111-1111-1111-1111-111111111111
        run: |
          chmod +x ./scripts/smoke-task.sh
          ./scripts/smoke-task.sh

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-task-log
          path: smoke-task.log
