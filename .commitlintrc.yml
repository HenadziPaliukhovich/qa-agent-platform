extends:
  - '@commitlint/config-conventional'

rules:
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - refactor
      - docs
      - test
      - chore
      - ci
      - perf
      - build
      - revert

  type-empty:
    - 2
    - never

  type-case:
    - 2
    - always
    - lower-case

  header-max-length:
    - 2
    - always
    - 100

  scope-empty:
    - 2
    - never

  scope-case:
    - 2
    - always
    - lower-case

  scope-enum:
    - 2
    - always
    - - backend
      - frontend
      - infra
      - docs
      - ci
      - github
      - context
      - workflow
      - orchestration
      - agents
      - integrations
      - auth
      - api
      - artifacts
      - payments
      - session
      - rewards
      - rg
      - testing
      - platform
      - repo
