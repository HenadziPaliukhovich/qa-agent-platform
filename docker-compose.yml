services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: qa_agent
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qa_task_api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_started
    working_dir: /app
    command: uvicorn backend.services.qa_task_api.app:app --host 0.0.0.0 --port 8001
    environment:
      DATABASE_URL: postgresql://qa:qa@postgres:5432/qa_agent
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      RESULT_SERVICE_URL: http://qa_result_service:8004
      RAG_SERVICE_URL: http://qa_rag_service:8005
    ports:
      - "8001:8001"

  qa_orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
      qa_llm_gateway:
        condition: service_started
      qa_result_service:
        condition: service_started
    working_dir: /app
    command: uvicorn backend.services.qa_orchestrator.app:app --host 0.0.0.0 --port 8002
    environment:
      DATABASE_URL: postgresql://qa:qa@postgres:5432/qa_agent
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LLM_GATEWAY_URL: http://qa_llm_gateway:8003
      RESULT_SERVICE_URL: http://qa_result_service:8004
      RAG_SERVICE_URL: http://qa_rag_service:8005/api/knowledge/search
      QA_ORCHESTRATOR_GROUP: qa-orchestrator
    ports:
      - "8002:8002"

  qa_llm_gateway:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis
    working_dir: /app
    command: uvicorn backend.services.qa_llm_gateway.app:app --host 0.0.0.0 --port 8003
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://host.docker.internal:11434
      DEFAULT_PROVIDER: ollama
      DEFAULT_OLLAMA_MODEL: llama3
    ports:
      - "8003:8003"

  qa_rag_service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    working_dir: /app
    command: uvicorn backend.services.qa_rag_service.app:app --host 0.0.0.0 --port 8005
    environment:
      DATABASE_URL: postgresql://qa:qa@postgres:5432/qa_agent
    ports:
      - "8005:8005"

  qa_result_service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    working_dir: /app
    command: uvicorn backend.services.qa_result_service.app:app --host 0.0.0.0 --port 8004
    environment:
      DATABASE_URL: postgresql://qa:qa@postgres:5432/qa_agent
    ports:
      - "8004:8004"
